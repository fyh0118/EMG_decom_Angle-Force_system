<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录界面预览 - 肌电慧控</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #e0e0e0;
        font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
    }

    /* 登录窗口容器 - 模拟800x500 */
    .login-window {
        width: 800px;
        height: 500px;
        background: #f0f2f5;
        border-radius: 12px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* 顶部标题栏 */
    .header {
        padding: 16px 30px 6px 30px;
        text-align: center;
    }
    .header .title {
        font-size: 28px;
        font-weight: bold;
        color: #2670bf;
    }
    .header .subtitle {
        font-size: 12px;
        color: #808080;
        margin-top: 2px;
    }
    .header .version {
        font-size: 10px;
        color: #b0b0b0;
        margin-top: 1px;
    }

    /* 主体：左右两栏 */
    .main-body {
        flex: 1;
        display: flex;
        padding: 10px 24px 16px 24px;
        gap: 24px;
        align-items: stretch;
    }

    /* 左侧：Logo区域 */
    .left-panel {
        flex: 0 0 42%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .left-panel img {
        max-width: 92%;
        max-height: 92%;
        object-fit: contain;
    }

    /* 右侧：模式选择区域 */
    .right-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
    }
    .right-panel .prompt {
        text-align: center;
        font-size: 15px;
        color: #333;
        font-weight: bold;
        margin-bottom: 4px;
    }
    .mode-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 68px;
        border-radius: 10px;
        font-size: 22px;
        font-weight: bold;
        color: #fff;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.1s, box-shadow 0.1s;
    }
    .mode-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .mode-btn:active {
        transform: translateY(0);
    }
    .btn-model { background: #2670bf; }
    .btn-rehab { background: #33a66b; }

    /* 底部 */
    .footer {
        text-align: center;
        padding: 8px;
        font-size: 10px;
        color: #c0c0c0;
    }
</style>
</head>
<body>

<div class="login-window">
    <!-- 顶部标题 -->
    <div class="header">
        <div class="title">肌电慧控</div>
        <div class="subtitle">基于高密度肌电分解的腕关节运动解码与康复评估系统</div>
        <div class="version">v1.0</div>
    </div>

    <!-- 左右两栏 -->
    <div class="main-body">
        <!-- 左侧Logo -->
        <div class="left-panel">
            <img src="使用工具生成图片.png" alt="肌电慧控 Logo">
        </div>

        <!-- 右侧模式选择 -->
        <div class="right-panel">
            <div class="prompt">请选择系统模式</div>
            <div class="mode-btn btn-model">模型验证系统</div>
            <div class="mode-btn btn-rehab">康复评估系统</div>
        </div>
    </div>

    <!-- 底部版权 -->
    <div class="footer">&copy; 2026 肌电慧控项目组</div>
</div>

</body>
</html>
